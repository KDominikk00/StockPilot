name: GPWCommandCenter
options:
  bundleIdPrefix: com.dominikkowalski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  GPWCommandCenter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Networking
      - path: Notifications
      - path: Features
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominikkowalski.gpwcommandcenter
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "GPW Command Center"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.dominikkowalski.gpwcommandcenter.refresh
